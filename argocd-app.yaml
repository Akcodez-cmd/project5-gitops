
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: habit-tracker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Akcodez-cmd/project5-gitops.git
    targetRevision: main
    path: habit-tracker
    helm:
      releaseName: habit-tracker
  destination:
    server: https://kubernetes.default.svc
    namespace: project5
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
